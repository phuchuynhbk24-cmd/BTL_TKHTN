<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 30 350 750" width="100%" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2D3748"/>
    </marker>
    <style>
      .edge  { fill: none; stroke: #4A5568; stroke-width: 1.5; marker-end: url(#arrow); stroke-linejoin: round; }
      .node  { stroke: #2D3748; stroke-width: 1.5; }
      .start, .end { fill: #E2E8F0; }
      .proc  { fill: #EBF8FF; }
      .sub   { fill: #EDF2F7; }
      .dec   { fill: #FEFCBF; stroke: #B7791F; }
      .junc  { fill: #2D3748; stroke: #2D3748; }
      .lbl   { font-size: 12px; font-weight: bold; fill: #2D3748; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4; text-anchor: start; }
      .node-text { text-anchor: middle; font-size: 13px; fill: #1A202C; }
      .sub-line { stroke: #2D3748; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: bold; fill: #2B6CB0; text-anchor: middle; }
    </style>
  </defs>

  <text class="title" x="325.0" y="60">3. CHƯƠNG TRÌNH CON: task_button_process()</text>

  <!-- 1. EDGES -->
  <path class="edge" d="M 300 100 V 140"/>
  <path class="edge" d="M 300 220 V 280"/>
  <path class="edge" d="M 300 360 V 420"/>
  <path class="edge" d="M 420 320 H 460 V 670 H 300"/>
  <path class="edge" d="M 300 500 V 550"/>
  <path class="edge" d="M 300 630 V 670"/>
  <path class="edge" d="M 300 670 V 720"/>

  <!-- 2. NODES -->
  <rect class="node start" x="200.0" y="60.0" width="200" height="40" rx="20.0"/>
  <rect class="node proc" x="190.0" y="140.0" width="220" height="80" rx="6"/>
  <polygon class="node dec" points="300,280.0 420.0,320 300,360.0 180.0,320"/>
  <rect class="node proc" x="190.0" y="420.0" width="220" height="80" rx="6"/>
  <rect class="node sub" x="190.0" y="550.0" width="220" height="80" rx="6"/>
  <line class="sub-line" x1="200.0" y1="550.0" x2="200.0" y2="630.0"/>
  <line class="sub-line" x1="400.0" y1="550.0" x2="400.0" y2="630.0"/>
  <circle class="junc" cx="300" cy="670" r="3"/>
  <rect class="node end" x="210.0" y="720.0" width="180" height="40" rx="20.0"/>

  <!-- 3. TEXTS -->
  <text class="node-text" x="300" y="80" dominant-baseline="central">task_button_process</text>
  <text class="node-text" x="300" y="171">Quét 4 nút vật lý<tspan x="300" dy="19">(Lọc rung 20ms)</tspan></text>
  <text class="node-text" x="300" y="320" dominant-baseline="central">Có sự kiện nhấn ?</text>
  <text class="node-text" x="300" y="441">1. Ép về MANUAL<tspan x="300" dy="18">2. Đảo bit thiết bị i</tspan><tspan x="300" dy="18">3. Khóa Touch 500ms</tspan></text>
  <text class="node-text" x="300" y="571">Chương trình con<tspan x="300" dy="18">display_mgr_dev()</tspan><tspan x="300" dy="18">(Vẽ vi sai tải)</tspan></text>
  <text class="node-text" x="300" y="740" dominant-baseline="central">Kết thúc</text>

  <!-- 4. LABELS -->
  <text class="lbl" x="314" y="375">Yes</text>
  <text class="lbl" x="435" y="312">No</text>
</svg>