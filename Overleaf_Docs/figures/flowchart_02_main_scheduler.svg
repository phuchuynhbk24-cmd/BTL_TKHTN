<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 30 390 1080" width="100%" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2D3748"/>
    </marker>
    <style>
      .edge  { fill: none; stroke: #4A5568; stroke-width: 1.5; marker-end: url(#arrow); stroke-linejoin: round; }
      .node  { stroke: #2D3748; stroke-width: 1.5; }
      .start, .end { fill: #E2E8F0; }
      .proc  { fill: #EBF8FF; }
      .sub   { fill: #EDF2F7; }
      .dec   { fill: #FEFCBF; stroke: #B7791F; }
      .junc  { fill: #2D3748; stroke: #2D3748; }
      .lbl   { font-size: 12px; font-weight: bold; fill: #2D3748; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4; text-anchor: start; }
      .node-text { text-anchor: middle; font-size: 13px; fill: #1A202C; }
      .sub-line { stroke: #2D3748; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: bold; fill: #2B6CB0; text-anchor: middle; }
    </style>
  </defs>

  <text class="title" x="345.0" y="60">2. LẬP LỊCH VÒNG LẶP CHÍNH (app_loop)</text>

  <!-- 1. EDGES -->
  <path class="edge" d="M 300 100 V 140"/>
  <path class="edge" d="M 300 140 V 180"/>
  <path class="edge" d="M 300 260 V 320"/>
  <path class="edge" d="M 420 220 H 460 V 440 H 300"/>
  <path class="edge" d="M 300 400 V 440"/>
  <path class="edge" d="M 300 440 V 480"/>
  <path class="edge" d="M 300 560 V 620"/>
  <path class="edge" d="M 420 520 H 460 V 740 H 300"/>
  <path class="edge" d="M 300 700 V 740"/>
  <path class="edge" d="M 300 740 V 780"/>
  <path class="edge" d="M 300 860 V 920"/>
  <path class="edge" d="M 420 820 H 460 V 1040 H 300"/>
  <path class="edge" d="M 300 1000 V 1040"/>
  <path class="edge" d="M 300 1040 V 1080 H 500 V 140 H 300"/>

  <!-- 2. NODES -->
  <rect class="node start" x="210.0" y="60.0" width="180" height="40" rx="20.0"/>
  <circle class="junc" cx="300" cy="140" r="3"/>
  <polygon class="node dec" points="300,180.0 420.0,220 300,260.0 180.0,220"/>
  <rect class="node sub" x="190.0" y="320.0" width="220" height="80" rx="6"/>
  <line class="sub-line" x1="200.0" y1="320.0" x2="200.0" y2="400.0"/>
  <line class="sub-line" x1="400.0" y1="320.0" x2="400.0" y2="400.0"/>
  <circle class="junc" cx="300" cy="440" r="3"/>
  <polygon class="node dec" points="300,480.0 420.0,520 300,560.0 180.0,520"/>
  <rect class="node sub" x="190.0" y="620.0" width="220" height="80" rx="6"/>
  <line class="sub-line" x1="200.0" y1="620.0" x2="200.0" y2="700.0"/>
  <line class="sub-line" x1="400.0" y1="620.0" x2="400.0" y2="700.0"/>
  <circle class="junc" cx="300" cy="740" r="3"/>
  <polygon class="node dec" points="300,780.0 420.0,820 300,860.0 180.0,820"/>
  <rect class="node sub" x="190.0" y="920.0" width="220" height="80" rx="6"/>
  <line class="sub-line" x1="200.0" y1="920.0" x2="200.0" y2="1000.0"/>
  <line class="sub-line" x1="400.0" y1="920.0" x2="400.0" y2="1000.0"/>
  <circle class="junc" cx="300" cy="1040" r="3"/>

  <!-- 3. TEXTS -->
  <text class="node-text" x="300" y="80" dominant-baseline="central">Bắt đầu app_loop</text>
  <text class="node-text" x="300" y="220" dominant-baseline="central">Δt ≥ 10ms ?</text>
  <text class="node-text" x="300" y="351">Chương trình con<tspan x="300" dy="19">task_button_process()</tspan></text>
  <text class="node-text" x="300" y="520" dominant-baseline="central">Δt ≥ 30ms ?</text>
  <text class="node-text" x="300" y="651">Chương trình con<tspan x="300" dy="19">task_touch_process()</tspan></text>
  <text class="node-text" x="300" y="820" dominant-baseline="central">Δt ≥ 500ms ?</text>
  <text class="node-text" x="300" y="951">Chương trình con<tspan x="300" dy="19">task_sensor_process()</tspan></text>

  <!-- 4. LABELS -->
  <text class="lbl" x="314" y="275">Yes</text>
  <text class="lbl" x="435" y="212">No</text>
  <text class="lbl" x="314" y="575">Yes</text>
  <text class="lbl" x="435" y="512">No</text>
  <text class="lbl" x="314" y="875">Yes</text>
  <text class="lbl" x="435" y="812">No</text>
</svg>