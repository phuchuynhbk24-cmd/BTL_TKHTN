<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 30 440 970" width="100%" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2D3748"/>
    </marker>
    <style>
      .edge  { fill: none; stroke: #4A5568; stroke-width: 1.5; marker-end: url(#arrow); stroke-linejoin: round; }
      .node  { stroke: #2D3748; stroke-width: 1.5; }
      .start, .end { fill: #E2E8F0; }
      .proc  { fill: #EBF8FF; }
      .sub   { fill: #EDF2F7; }
      .dec   { fill: #FEFCBF; stroke: #B7791F; }
      .junc  { fill: #2D3748; stroke: #2D3748; }
      .lbl   { font-size: 12px; font-weight: bold; fill: #2D3748; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4; text-anchor: start; }
      .node-text { text-anchor: middle; font-size: 13px; fill: #1A202C; }
      .sub-line { stroke: #2D3748; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: bold; fill: #2B6CB0; text-anchor: middle; }
      .panel-bg { fill: #F7FAFC; stroke: #CBD5E0; stroke-width: 1; stroke-dasharray: 4; rx: 8; }
    </style>
  </defs>

  <text class="title" x="370.0" y="60">CHƯƠNG TRÌNH CON: task_touch_process()</text>

  <!-- 1. EDGES -->
  <path class="edge" d="M 300 100 V 140"/>
  <path class="edge" d="M 300 220 V 280"/>
  <path class="edge" d="M 420 180 H 550 V 900 H 300"/>
  <path class="edge" d="M 300 360 V 420"/>
  <path class="edge" d="M 420 320 H 520 V 870 H 300"/>
  <path class="edge" d="M 300 500 V 560"/>
  <path class="edge" d="M 420 460 H 490 V 840 H 300"/>
  <path class="edge" d="M 300 640 V 700"/>
  <path class="edge" d="M 420 600 H 460 V 810 H 300"/>
  <path class="edge" d="M 300 780 V 810"/>
  <path class="edge" d="M 300 810 V 840"/>
  <path class="edge" d="M 300 840 V 870"/>
  <path class="edge" d="M 300 870 V 900"/>
  <path class="edge" d="M 300 900 V 940"/>

  <!-- 2. NODES -->
  <rect class="node start" x="200.0" y="60.0" width="200" height="40" rx="20.0"/>
  <polygon class="node dec" points="300,140.0 420.0,180 300,220.0 180.0,180"/>
  <polygon class="node dec" points="300,280.0 420.0,320 300,360.0 180.0,320"/>
  <polygon class="node dec" points="300,420.0 420.0,460 300,500.0 180.0,460"/>
  <polygon class="node dec" points="300,560.0 420.0,600 300,640.0 180.0,600"/>
  <rect class="node proc" x="190.0" y="700.0" width="220" height="80" rx="6"/>
  <circle class="junc" cx="300" cy="810" r="3"/>
  <circle class="junc" cx="300" cy="840" r="3"/>
  <circle class="junc" cx="300" cy="870" r="3"/>
  <circle class="junc" cx="300" cy="900" r="3"/>
  <rect class="node end" x="210.0" y="940.0" width="180" height="40" rx="20.0"/>

  <!-- 3. TEXTS -->
  <text class="node-text" x="300" y="80" dominant-baseline="central">task_touch_process</text>
  <text class="node-text" x="300" y="180" dominant-baseline="central">Hết khóa 500ms ?</text>
  <text class="node-text" x="300" y="320" dominant-baseline="central">Đọc ADC hợp lệ ?</text>
  <text class="node-text" x="300" y="451">Ổn định ≥ 60ms<tspan x="300" dy="19">& hết Cooldown ?</tspan></text>
  <text class="node-text" x="300" y="600" dominant-baseline="central">Hit-test trúng icon ?</text>
  <text class="node-text" x="300" y="721">1. Cập nhật Mode/Tải<tspan x="300" dy="18">2. Vẽ vi sai LCD TFT</tspan><tspan x="300" dy="18">3. Đặt Cooldown 350ms</tspan></text>
  <text class="node-text" x="300" y="960" dominant-baseline="central">Kết thúc</text>

  <!-- 4. LABELS -->
  <text class="lbl" x="314" y="235">Yes</text>
  <text class="lbl" x="435" y="172">No</text>
  <text class="lbl" x="314" y="375">Yes</text>
  <text class="lbl" x="435" y="312">No</text>
  <text class="lbl" x="314" y="515">Yes</text>
  <text class="lbl" x="435" y="452">No</text>
  <text class="lbl" x="314" y="655">Yes</text>
  <text class="lbl" x="435" y="592">No</text>
</svg>