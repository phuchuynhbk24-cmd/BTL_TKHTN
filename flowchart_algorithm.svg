  <!-- 3. TEXTS -->
  <text class="node-text" x="240" y="170" dominant-baseline="central">Bắt đầu app_init()</text>
  <text class="node-text" x="240" y="261">Khởi tạo ngoại vi<tspan x="240" dy="19">(Button, XPT, TFT)</tspan></text>
  <text class="node-text" x="240" y="391">mode_control_init()<tspan x="240" dy="19">(Mặc định: MANUAL)</tspan></text>
  <text class="node-text" x="240" y="511">Chương trình con<tspan x="240" dy="18">display_draw_screen()</tspan><tspan x="240" dy="18">(Vẽ khung nền TFT)</tspan></text>
  <text class="node-text" x="240" y="630" dominant-baseline="central">Chuyển sang app_loop()</text>
  <text class="node-text" x="240" y="810" dominant-baseline="central">Bắt đầu app_loop</text>
  <text class="node-text" x="240" y="950" dominant-baseline="central">Δt ≥ 10ms ?</text>
  <text class="node-text" x="240" y="1081">Chương trình con<tspan x="240" dy="19">task_button_process()</tspan></text>
  <text class="node-text" x="240" y="1250" dominant-baseline="central">Δt ≥ 30ms ?</text>
  <text class="node-text" x="240" y="1381">Chương trình con<tspan x="240" dy="19">task_touch_process()</tspan></text>
  <text class="node-text" x="240" y="1550" dominant-baseline="central">Δt ≥ 500ms ?</text>
  <text class="node-text" x="240" y="1681">Chương trình con<tspan x="240" dy="19">task_sensor_process()</tspan></text>
  <text class="node-text" x="700" y="170" dominant-baseline="central">task_button_process</text>
  <text class="node-text" x="700" y="261">Quét 4 nút vật lý<tspan x="700" dy="19">(Lọc rung 20ms)</tspan></text>
  <text class="node-text" x="700" y="410" dominant-baseline="central">Có sự kiện nhấn ?</text>
  <text class="node-text" x="700" y="531">1. Ép về MANUAL<tspan x="700" dy="18">2. Đảo bit thiết bị i</tspan><tspan x="700" dy="18">3. Khóa Touch 500ms</tspan></text>
  <text class="node-text" x="700" y="661">Chương trình con<tspan x="700" dy="18">display_mgr_dev()</tspan><tspan x="700" dy="18">(Vẽ vi sai tải)</tspan></text>
  <text class="node-text" x="700" y="830" dominant-baseline="central">Kết thúc</text>
  <text class="node-text" x="700" y="1010" dominant-baseline="central">task_sensor_process</text>
  <text class="node-text" x="700" y="1101">Đọc 4 cảm biến<tspan x="700" dy="19">(Temp, Humi, LDR, PIR)</tspan></text>
  <text class="node-text" x="700" y="1221">Chương trình con<tspan x="700" dy="18">display_mgr_sns()</tspan><tspan x="700" dy="18">(Vẽ vi sai số đo)</tspan></text>
  <text class="node-text" x="700" y="1340" dominant-baseline="central">Kết thúc</text>
  <text class="node-text" x="1180" y="170" dominant-baseline="central">task_touch_process</text>
  <text class="node-text" x="1180" y="270" dominant-baseline="central">Hết khóa 500ms ?</text>
  <text class="node-text" x="1180" y="410" dominant-baseline="central">Đọc ADC hợp lệ ?</text>
  <text class="node-text" x="1180" y="541">Ổn định ≥ 60ms<tspan x="1180" dy="19">& hết Cooldown ?</tspan></text>
  <text class="node-text" x="1180" y="690" dominant-baseline="central">Hit-test trúng icon ?</text>
  <text class="node-text" x="1180" y="821">1. Cập nhật Mode/Tải<tspan x="1180" dy="19">2. Đặt Cooldown 350ms</tspan></text>
  <text class="node-text" x="1180" y="941">Chương trình con<tspan x="1180" dy="18">display_mgr_update()</tspan><tspan x="1180" dy="18">(Vẽ vi sai Mode/Tải)</tspan></text>
  <text class="node-text" x="1180" y="1180" dominant-baseline="central">Kết thúc</text>
  <text class="node-text" x="1180" y="1370" dominant-baseline="central">display_manager_update</text>
  <text class="node-text" x="1180" y="1461">Nhận yêu cầu hiển thị<tspan x="1180" dy="19">(Mode, Tải, Cảm biến)</tspan></text>
  <text class="node-text" x="1180" y="1610" dominant-baseline="central">Dữ liệu != Bộ đệm ?</text>
  <text class="node-text" x="1180" y="1731">1. Xóa vùng số/icon cũ<tspan x="1180" dy="18">2. Vẽ giá trị mới lên</tspan><tspan x="1180" dy="18">3. Cập nhật s_cached</tspan></text>
  <text class="node-text" x="1180" y="1900" dominant-baseline="central">Kết thúc</text>

