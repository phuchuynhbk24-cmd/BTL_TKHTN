<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 1960" width="100%" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2D3748"/>
    </marker>
    <style>
      .edge  { fill: none; stroke: #4A5568; stroke-width: 1.5; marker-end: url(#arrow); stroke-linejoin: round; }
      .node  { stroke: #2D3748; stroke-width: 1.5; }
      .start, .end { fill: #E2E8F0; }
      .proc  { fill: #EBF8FF; }
      .sub   { fill: #EDF2F7; }
      .dec   { fill: #FEFCBF; stroke: #B7791F; }
      .junc  { fill: #2D3748; stroke: #2D3748; }
      .lbl   { font-size: 12px; font-weight: bold; fill: #2D3748; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4; text-anchor: start; }
      .node-text { text-anchor: middle; font-size: 13px; fill: #1A202C; }
      .sub-line { stroke: #2D3748; stroke-width: 1.5; }
      .panel-bg { fill: #FFFFFF; stroke: #CBD5E0; stroke-width: 1.5; rx: 12; }
      .panel-title { font-size: 14.5px; font-weight: bold; fill: #2B6CB0; text-anchor: middle; }
      .main-title { font-size: 21px; font-weight: bold; fill: #1A202C; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1460" height="1960" fill="#F8FAFC"/>
  <text class="main-title" x="730" y="38">KIẾN TRÚC TOÀN DIỆN LƯU ĐỒ GIẢI THUẬT HỆ THỐNG PHÒNG THÔNG MINH (STM32F103)</text>

  <!-- Panel 1A: app_init -->
  <rect class="panel-bg" x="30" y="60" width="420" height="560"/>
  <text class="panel-title" x="240" y="90">1. KHỞI TẠO HỆ THỐNG &amp; NỀN TFT (app_init)</text>

  <!-- Panel 1B: app_loop -->
  <rect class="panel-bg" x="30" y="640" width="420" height="1280"/>
  <text class="panel-title" x="240" y="670">2. BỘ LẬP LỊCH CHÍNH (app_loop)</text>

  <!-- Panel 2A: task_button -->
  <rect class="panel-bg" x="480" y="60" width="440" height="820"/>
  <text class="panel-title" x="700" y="90">3. XỬ LÝ NÚT VẬT LÝ (task_button_process)</text>

  <!-- Panel 2B: task_sensor -->
  <rect class="panel-bg" x="480" y="900" width="440" height="490"/>
